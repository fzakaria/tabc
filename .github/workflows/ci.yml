# Formatting first, then `nix flake check`, which runs everything the
# flake defines:
#
#   checks.tabc — the Go tests, as the package builds
#   checks.e2e  — containers from an example bundle, run in a real
#                 headless Chromium: output, exit status, both output
#                 streams, input, a writable root
#
# Windows has no Nix, so its job takes the Windows archive the first
# job built and runs it on a Windows machine: the Go tests from the
# source, then containers from a pulled image in the Chrome the machine
# has.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The end-to-end check runs Chromium with its sandbox on, and the
      # sandbox needs to make a user namespace. Ubuntu's runners deny
      # that to unprivileged programs unless this is turned off.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Formatting
        run: nix fmt -- --ci

      - name: Tests
        run: nix flake check -L

      # The check above built every system's archive, so this build
      # only names the result.
      - name: The release's archives
        run: nix build .#release

      - name: Keep the Windows archive for the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: tabc-windows-amd64
          path: result/tabc-windows-amd64.zip
          retention-days: 7

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tests
        run: go test ./...

      - uses: actions/download-artifact@v4
        with:
          name: tabc-windows-amd64

      - name: Unpack the archive
        run: Expand-Archive tabc-windows-amd64.zip -DestinationPath .

      # The image comes from a registry that does not count pulls
      # against the address a shared machine pulls from.
      - name: Containers in the machine's Chrome
        shell: pwsh
        env:
          IMAGE: public.ecr.aws/docker/library/alpine:3
        run: |
          $tabc = Join-Path $PWD 'tabc-windows-amd64\tabc.exe'

          function Check($what, $got, $want) {
            if ("$got" -ne "$want") {
              throw "${what}: got '$got', want '$want'"
            }
            Write-Host "ok: $what"
          }

          & $tabc --version
          Check 'the version command' $LASTEXITCODE 0

          $out = & $tabc run $env:IMAGE echo hi
          Check 'output' $out 'hi'
          Check 'the status of a program that succeeds' $LASTEXITCODE 0

          & $tabc run $env:IMAGE sh -c 'exit 7'
          Check 'exit status' $LASTEXITCODE 7

          $out = 'from the host' | & $tabc run -i $env:IMAGE cat
          Check 'input, to its end' $out 'from the host'

          # A volume: a directory of this machine, named with a drive
          # letter, read and changed by the program.
          New-Item -ItemType Directory volume | Out-Null
          Set-Content -NoNewline -Path volume\given -Value 'from the host'
          $script = 'cat /data/given && echo && echo from the guest > /data/made && mkdir /data/sub && mv /data/made /data/sub/moved && ls /data/sub'
          $out = & $tabc run -v "$PWD\volume:/data" $env:IMAGE sh -c $script
          Check 'a volume, read and changed in the guest' ($out -join ',') 'from the host,moved'
          Check 'a volume, as the host sees it afterwards' (Get-Content volume\sub\moved) 'from the guest'
