# A release for someone without Nix: pushing a tag `v<version>` builds
# tabc for Linux and for a Mac, x86-64 and arm64 each, and publishes the
# four archives and their checksums as that tag's GitHub release.
#
#   packages.release — the archives, all cross-compiled here by Go
#
# The tag has to name the version the source gives itself
# (nix/go.nix), which is what `tabc --version` prints. Run by hand, the
# workflow builds the archives and keeps them with the run, and
# publishes nothing.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: The tag names the source's version
        if: github.ref_type == 'tag'
        run: |
          version=$(nix eval --raw .#release.version)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME and nix/go.nix has version $version"
            exit 1
          fi

      - name: Build
        run: nix build -L .#release

      - name: Keep the archives with the run
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: result/*

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" result/* --verify-tag --generate-notes --title "tabc $GITHUB_REF_NAME"
