<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tabc</title>
    <style>
      /* One container, as a page someone may be looking at: a bar that
         says what the container is and how it is doing, and under it
         everything the program has printed. Headless Chromium loads the
         same page and nobody sees it. */
      :root {
        --ground: #16181d;
        --bar: #20232b;
        --ink: #d7dae0;
        --muted: #8b91a0;
        --running: #5fb878;
        --waiting: #d9a441;
        --failed: #e06c75;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--ground);
        color: var(--ink);
        font:
          13px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      header {
        display: flex;
        gap: 0.75rem;
        align-items: baseline;
        padding: 0.45rem 0.75rem;
        background: var(--bar);
        white-space: nowrap;
        overflow: hidden;
      }
      #title {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status {
        margin-left: auto;
        color: var(--muted);
      }
      #status::before {
        content: "";
        display: inline-block;
        width: 0.6em;
        height: 0.6em;
        margin-right: 0.45em;
        border-radius: 50%;
        background: var(--waiting);
      }
      #status[data-state="running"]::before {
        background: var(--running);
      }
      #status[data-state="failed"]::before {
        background: var(--failed);
      }
      #status[data-state="exited"]::before {
        background: var(--muted);
      }
      #output {
        flex: 1;
        margin: 0;
        padding: 0.6rem 0.75rem;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #output .stderr {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <span id="title">tabc</span>
      <span id="status" data-state="waiting">starting</span>
    </header>
    <pre id="output"></pre>
    <script type="module" src="main.js"></script>
  </body>
</html>
