<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tabc</title>
    <link rel="stylesheet" href="xterm/xterm.css" />
    <style>
      /* One container, as a page someone may be looking at: a bar that
         says what the container is and how it is doing, and under it
         the terminal its program runs on. Headless Chromium loads the
         same page and nobody sees it. */
      :root {
        --ground: #16181d;
        --bar: #20232b;
        --ink: #d7dae0;
        --muted: #8b91a0;
        --running: #5fb878;
        --waiting: #d9a441;
        --failed: #e06c75;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--ground);
        color: var(--ink);
        font:
          13px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      header {
        display: flex;
        gap: 0.75rem;
        align-items: baseline;
        padding: 0.45rem 0.75rem;
        background: var(--bar);
        white-space: nowrap;
        overflow: hidden;
      }
      #title {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status {
        margin-left: auto;
        color: var(--muted);
      }
      #status::before {
        content: "";
        display: inline-block;
        width: 0.6em;
        height: 0.6em;
        margin-right: 0.45em;
        border-radius: 50%;
        background: var(--waiting);
      }
      #status[data-state="running"]::before {
        background: var(--running);
      }
      #status[data-state="failed"]::before {
        background: var(--failed);
      }
      #status[data-state="exited"]::before {
        background: var(--muted);
      }
      body.embedded header {
        display: none;
      }
      #terminal {
        flex: 1;
        min-height: 0;
        padding: 0.5rem 0 0 0.6rem;
      }
    </style>
  </head>
  <body>
    <header>
      <span id="title">tabc</span>
      <span id="status" data-state="waiting">starting</span>
    </header>
    <div id="terminal"></div>
    <!-- The terminal and its fit addon each define a global, so they
         load as plain scripts before the page's own module. -->
    <script src="xterm/xterm.js"></script>
    <script src="xterm/addon-fit.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
